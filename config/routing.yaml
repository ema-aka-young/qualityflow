# QualityFlow Project Routing Map
# Maps issue sources (Jira prefixes, GitHub repos) to project configurations
version: "2.0"

routes:
  - project: "cnv"
    jira_prefixes:
      - "CNV"
      - "VIRTSTRAT"
    github_repos:
      - "kubevirt/kubevirt"
      - "kubevirt/containerized-data-importer"
      - "kubevirt/kubevirt-velero-plugin"
      - "RedHatQE/openshift-virtualization-tests"
      - "RedHatQE/openshift-virtualization-tests-design-docs"
      - "RedHatQE/openshift-python-wrapper"
      - "kubevirt/kubevirt-migration-operator"
      - "kubevirt/vm-file-restore-operator"

  # Add routes for your project:
  # - project: "my-project"
  #   jira_prefixes:
  #     - "PROJ"
  #   github_repos:
  #     - "my-org/my-repo"

# null = error on unknown prefix/repo (fail-fast, unless SOURCE_REPO_PATH
# is set, which triggers auto-discovery)
default_project: null
