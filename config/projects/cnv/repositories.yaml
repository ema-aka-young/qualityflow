# Repository configuration for CNV / OpenShift Virtualization.
# QualityFlow uses this to fetch PR diffs, find test locations,
# and determine build/test commands.

# The QE test suite (where QF-generated Python tests belong).
primary_repo:
  name: "openshift-virtualization-tests"
  org: "RedHatQE"
  full_name: "RedHatQE/openshift-virtualization-tests"
  url: "https://github.com/RedHatQE/openshift-virtualization-tests"
  local_path_env: "SOURCE_REPO_PATH"
  default_branch: "main"
  language: "python"
  build_system: "uv"
  build_command: "uv run pytest"

repo_files:
  agents_rules:
    repo: "primary_repo"
    path: "AGENTS.md"
    fallback: null
    description: "QE test conventions and generation rules"
  stp_template:
    repo: "design_docs_repo"
    path: "stps/stp-template/stp.md"
    fallback: "templates/stp/stp-template.md"
    description: "Official CNV software test plan template"
  stp_guide:
    repo: "design_docs_repo"
    path: "docs/stp-guide.md"
    fallback: null
    description: "Official CNV software test plan authoring guide"
  testing_tiers:
    repo: "design_docs_repo"
    path: "docs/testing-tiers.md"
    fallback: null
    description: "Official CNV test-tier definitions"

design_docs_repo:
  name: "openshift-virtualization-tests-design-docs"
  org: "RedHatQE"
  full_name: "RedHatQE/openshift-virtualization-tests-design-docs"
  url: "https://github.com/RedHatQE/openshift-virtualization-tests-design-docs"
  local_path_env: "OPENSHIFT_VIRTUALIZATION_TESTS_DESIGN_DOCS_REPO_PATH"
  default_branch: "main"

# Product under test + the client library the tests build on.
additional_repos:
  - name: "kubevirt"
    org: "kubevirt"
    full_name: "kubevirt/kubevirt"
    url: "https://github.com/kubevirt/kubevirt"
    # Without local_path_env the regression-analyzer never looks for a local
    # checkout of this repo (agents/regression-analyzer.md Step 0.1 resolves
    # only entries that declare one), so LSP/grep analysis silently skips the
    # product under test even when the source is present on disk.
    language: "go"
    local_path_env: "KUBEVIRT_REPO_PATH"

  - name: "openshift-python-wrapper"
    org: "RedHatQE"
    full_name: "RedHatQE/openshift-python-wrapper"
    url: "https://github.com/RedHatQE/openshift-python-wrapper"
    default_branch: "main"
    local_path_env: "OPENSHIFT_PYTHON_WRAPPER_REPO_PATH"
    language: "python"

  - name: "containerized-data-importer"
    org: "kubevirt"
    full_name: "kubevirt/containerized-data-importer"
    url: "https://github.com/kubevirt/containerized-data-importer"
    default_branch: "main"
    language: "go"
    local_path_env: "CDI_REPO_PATH"

  - name: "kubevirt-velero-plugin"
    org: "kubevirt"
    full_name: "kubevirt/kubevirt-velero-plugin"
    url: "https://github.com/kubevirt/kubevirt-velero-plugin"
    default_branch: "main"
    language: "go"
    local_path_env: "KUBEVIRT_VELERO_PLUGIN_REPO_PATH"

  - name: "kubevirt-migration-operator"
    org: "kubevirt"
    full_name: "kubevirt/kubevirt-migration-operator"
    url: "https://github.com/kubevirt/kubevirt-migration-operator"
    default_branch: "main"
    language: "go"
    local_path_env: "KUBEVIRT_MIGRATION_OPERATOR_REPO_PATH"

  - name: "vm-file-restore-operator"
    org: "kubevirt"
    full_name: "kubevirt/vm-file-restore-operator"
    url: "https://github.com/kubevirt/vm-file-restore-operator"
    default_branch: "main"
    language: "go"
    local_path_env: "VM_FILE_RESTORE_OPERATOR_REPO_PATH"

pr_url_patterns:
  - "https://github.com/{org}/{repo}/pull/{number}"
