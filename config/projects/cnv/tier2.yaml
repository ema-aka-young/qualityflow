enabled: true
tier: "Tier 2"
display_name: "End-to-End"
description: >-
  Python/pytest tests for complete user workflows and multi-feature integrations
  from the OpenShift Virtualization user's perspective.
language: "python"
framework: "pytest"
reference_guide: "https://github.com/RedHatQE/openshift-virtualization-tests/blob/main/docs/SOFTWARE_TEST_DESCRIPTION.md"
reference_tests:
  - "https://github.com/RedHatQE/openshift-virtualization-tests/blob/main/tests/storage/online_resize/test_online_resize.py"
imports:
  framework:
    - "pytest"
test_patterns:
  function_prefix: "test_"
  class_prefix: "Test"
  assertion_style: "assert"
