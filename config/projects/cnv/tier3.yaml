enabled: true
tier: "Tier 3"
display_name: "Extended Validation"
description: >-
  Python/pytest tests for scenarios whose hardware, platform, storage, scale, or
  runtime requirements place them outside standard CI.
language: "python"
framework: "pytest"
reference_guide: "https://github.com/RedHatQE/openshift-virtualization-tests-design-docs/blob/main/docs/testing-tiers.md"
reference_tests:
  - "https://github.com/RedHatQE/openshift-virtualization-tests/tree/main/tests"
markers:
  - "tier3"
imports:
  framework:
    - "pytest"
test_patterns:
  function_prefix: "test_"
  class_prefix: "Test"
  assertion_style: "assert"
